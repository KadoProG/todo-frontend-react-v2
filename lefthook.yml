pre-commit:
  piped: true
  commands:
    format:
      priority: 1
      glob: '*.{js,jsx,ts,tsx,json,css}'
      stage_fixed: true
      run: npx prettier --write --ignore-path .gitignore --ignore-unknown {staged_files}
    eslint:
      priority: 2
      glob: '*.{ts,tsx}'
      run: npx eslint --max-warnings=0 --no-warn-ignored {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npx tsc -b
